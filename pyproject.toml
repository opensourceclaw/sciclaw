[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepclaw"
version = "0.1.0"
description = "Open-source Deep Research framework based on OpenClaw"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Peter Cheng", email = "peter@example.com"}
]
requires-python = ">=3.10"
dependencies = [
    "openclaw>=0.9.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
deepclaw = "deepclaw.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

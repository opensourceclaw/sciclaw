[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "researchclaw"
version = "0.5.0"
description = "Open-source Deep Research framework based on OpenClaw"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Peter Cheng", email = "peter@example.com"}
]
requires-python = ">=3.10"
dependencies = [
    "openclaw>=0.9.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "lxml>=4.9.0",
    "html2text>=2020.1.16",
    "ddgs>=9.0.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.6",
    "weasyprint>=62.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
api = [
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.0",
]

[project.scripts]
researchclaw = "researchclaw.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

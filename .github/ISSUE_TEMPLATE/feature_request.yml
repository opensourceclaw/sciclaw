name: Feature request
description: Suggest a capability or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that SciClaw does not support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen? Note any interface you would expect (CLI flag, API field, report section).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, or other designs you weighed.
    validations:
      required: false
  - type: dropdown
    id: surface
    attributes:
      label: Which surface
      options:
        - CLI (search / research / report / serve)
        - Research pipeline (search, synthesis, verification, gates)
        - Report output / evidence chain
        - OpenClaw plugin integration
        - Other
    validations:
      required: true
